
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Employee Portal</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>DevOps Employee Portal</h1>
        <p>Welcome to our company dashboard</p>
    </header>

    <main>
        <h2>Employee Details</h2>

        <div class="employee-card">
            <h3>Gautham R</h3>
            <p>Role: AWS Cloud Engineer</p>
            <p>Department: Cloud & DevOps</p>

            <button id="detailsBtn">View Details</button>
            <p id="message"></p>

            <hr>

            <h2>Employee Attendance</h2>

            <button id="attendanceBtn">Mark Attendance</button>
            <p id="attendance"></p>
        </div>
    </main>

    <script src="./js/script.js"></script>

</body>
</html>
